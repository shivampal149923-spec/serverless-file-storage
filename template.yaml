AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless File Storage System (S3 + Lambda + API Gateway + DynamoDB + Cognito)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref FilesTable
        BUCKET_NAME: !Ref FileBucket

Resources:
  # ---------- Storage ----------
  FileBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: CostControl
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: ["*"] # change to your frontend domain in production
            AllowedHeaders: ["*"]
            MaxAge: 3000

  FilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: file_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: file_id
          KeyType: RANGE

  # ---------- Authentication ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ---------- API ----------
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Auth:
        DefaultAuthorizer: CognitoAuth
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'" # change to your frontend domain in production

  # ---------- Lambda functions ----------
  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: upload.lambda_handler
      CodeUri: ../backend/lambdas/
      Policies:
        - S3WritePolicy:
            BucketName: !Ref FileBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref FilesTable
      Events:
        Upload:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /upload-url
            Method: post

  ListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: list_files.lambda_handler
      CodeUri: ../backend/lambdas/
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FilesTable
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /files
            Method: get

  DownloadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: download.lambda_handler
      CodeUri: ../backend/lambdas/
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref FileBucket
        - DynamoDBReadPolicy:
            TableName: !Ref FilesTable
      Events:
        Download:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /files/{file_id}
            Method: get

  DeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: delete.lambda_handler
      CodeUri: ../backend/lambdas/
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref FileBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref FilesTable
      Events:
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /files/{file_id}
            Method: delete

Outputs:
  ApiUrl:
    Description: Paste into frontend/config.js as API_URL
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod"
  UserPoolClientId:
    Description: Paste into frontend/config.js as COGNITO_CLIENT_ID
    Value: !Ref UserPoolClient
  Region:
    Description: Paste into frontend/config.js as COGNITO_REGION
    Value: !Ref AWS::Region
  BucketName:
    Value: !Ref FileBucket
